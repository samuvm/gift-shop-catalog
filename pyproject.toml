[project]
name = "gift-shop-catalog"
version = "0.1.0"
description = "Catalog Service: a gift shop CSV exposed as LLM-friendly tools (REST + OpenAPI, MCP)."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.162.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
    "hypothesis==6.170.13",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "tiktoken==0.14.0",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Tooling that runs git and detect-secrets with fixed arguments, never user input.
"scripts/secrets_check.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["catalog"]

[[tool.mypy.overrides]]
# jsonschema ships no type information; its stubs would be one more dependency for one import.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: slower tests that build the full catalogue or start the app"]

[tool.coverage.run]
source = ["src/catalog"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Testing regime per package. Read by `make done`, not by humans.
[tool.gate]
tdd_required  = ["src/catalog/domain", "src/catalog/ingest"]
tdd_forbidden = ["src/catalog/api"]           # contract-tested against the served OpenAPI snapshot
line_coverage_min = 85                       # over tdd_required packages
